<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>英単語トレーナー</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
</head>
<body>
  <nav>
    <span class="nav-brand">英単語トレーナー</span>
    <a href="{{ url_for('quiz.index') }}" class="{{ 'active' if request.path == '/' else '' }}">出題</a>
    <a href="{{ url_for('words.new_word') }}" class="{{ 'active' if request.path == '/words/new' else '' }}">登録</a>
    <a href="{{ url_for('words.list_words') }}" class="{{ 'active' if request.path == '/words' else '' }}">単語一覧</a>
    <a href="{{ url_for('settings.index') }}" class="{{ 'active' if request.path == '/settings' else '' }}">設定</a>
  </nav>

  <main>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <ul class="flash-list">
          {% for category, message in messages %}
            <li class="flash {{ category }}">{{ message }}</li>
          {% endfor %}
        </ul>
      {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}
  </main>

  <script src="{{ url_for('static', filename='js/card.js') }}"></script>
</body>
</html>
