{% extends "base.html" %}

{% block content %}
{% if word is none %}
  <div id="quiz-area" class="empty-state">
    <p>まだ単語が登録されていません</p>
    <a href="{{ url_for('words.new_word') }}" class="btn btn--primary">単語を登録する</a>
  </div>

{% else %}
  <div id="quiz-area">
    <div class="card" id="quiz-card">
      <div class="card__word" id="quiz-word">{{ word.english }}</div>
      <div id="card-back" class="hidden">
        <div class="card__meaning" id="quiz-meaning">{{ word.meaning }}</div>
      </div>
    </div>

    <div id="reveal-section" class="btn-group">
      <button id="reveal-btn" class="btn btn--ghost">タップして答えを見る</button>
    </div>

    <div id="answer-buttons" class="hidden">
      <div class="btn-group">
        <button class="btn btn--correct score-btn"
                data-word-id="{{ word.id }}"
                data-word-english="{{ word.english }}"
                data-result="correct">正解 ○</button>

        <button class="btn btn--wrong score-btn"
                data-word-id="{{ word.id }}"
                data-word-english="{{ word.english }}"
                data-result="wrong">不正解 ×</button>

        <button class="btn btn--master master-btn{% if settings.mastery_mode != 'manual' %} hidden{% endif %}"
                data-word-id="{{ word.id }}"
                data-word-english="{{ word.english }}">覚えた ✓</button>
      </div>
    </div>
  </div>
{% endif %}
{% endblock %}
